[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serviceability-service"
version = "2.0.0"
description = "Serviceability service: US address validation and network coverage as REST API + MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sales-common",            # install libs/sales_common first (brings psycopg, httpx, google-adk[mcp])
    "mcp>=2.2,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["serviceability_service*"]
