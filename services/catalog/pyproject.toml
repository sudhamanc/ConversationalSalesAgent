[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-service"
version = "2.0.0"
description = "Product catalog service: REST API (/api/v1) and MCP server (/mcp/) with product-knowledge RAG"
requires-python = ">=3.11"
dependencies = [
    "sales-common",               # installed first from libs/sales_common (brings google-adk[mcp], psycopg)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["catalog_service*"]
