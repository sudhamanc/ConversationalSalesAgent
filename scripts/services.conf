# Service manifest: the single source of truth for every ops script
# (start_local.sh, stop_local.sh, deploy_cloud.sh, docker-compose.yml mirrors it).
#
# Columns (pipe-separated, no spaces around '|'):
#   name            short service name (compose service name, --only value, logs/<name>.log)
#   dir             service directory relative to the repo root (contains pyproject.toml + Dockerfile)
#   module          uvicorn app ("pkg.module:app"); the gateway runs from <dir>/server
#   port            local port (start_local.sh / docker-compose)
#   kind            tool | agent | gateway   (start/deploy order: tools, agents, gateway)
#   cloud_run_name  Cloud Run service name (also the Artifact Registry image name)
#   a2a_name        A2A agent name for agents (gateway env AGENT_URL_<A2A_NAME_UPPER>); empty otherwise
#   mcp_deps        comma-separated ENV_VAR=tool_service pairs; the agent gets ENV_VAR=<tool url>/mcp/
#
# Adding an agent = one line here (+ its Dockerfile, + a block in docker-compose.yml).
#
# name|dir|module|port|kind|cloud_run_name|a2a_name|mcp_deps
catalog|services/catalog|catalog_service.app:app|8101|tool|csa-catalog||
serviceability|services/serviceability|serviceability_service.app:app|8102|tool|csa-serviceability||
discovery|DiscoveryAgent|discovery_agent.server:app|8201|agent|csa-agent-discovery|discovery_agent|
serviceability-agent|ServiceabilityAgent|serviceability_agent.server:app|8202|agent|csa-agent-serviceability|serviceability_agent|SERVICEABILITY_MCP_URL=serviceability
product|ProductAgent|product_agent.server:app|8203|agent|csa-agent-product|product_agent|CATALOG_MCP_URL=catalog
offer|OfferManagement|offer_management.server:app|8204|agent|csa-agent-offer|offer_management_agent|
order|OrderAgent|order_agent.server:app|8205|agent|csa-agent-order|order_agent|
payment|PaymentAgent|payment_agent.server:app|8206|agent|csa-agent-payment|payment_agent|
fulfillment|ServiceFulfillmentAgent|service_fulfillment_agent.server:app|8207|agent|csa-agent-fulfillment|service_fulfillment_agent|
communication|CustomerCommunicationAgent|customer_communication_agent.server:app|8208|agent|csa-agent-communication|customer_communication_agent|
greeting|GreetingAgent|greeting_agent.server:app|8209|agent|csa-agent-greeting|greeting_agent|
faq|FAQAgent|faq_agent.server:app|8210|agent|csa-agent-faq|faq_agent|
gateway|SuperAgent|main:app|8000|gateway|csa-gateway||
