[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-common"
version = "2.0.0"
description = "Shared runtime library for the Conversational Sales Agent services (ADK 2.x, A2A, MCP, PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a,mcp,db]==2.10.0",
    "asyncpg>=0.30",
    "greenlet>=3.0",           # required by SQLAlchemy 2.1 asyncio (ADK DatabaseSessionService)
    "psycopg[binary,pool]>=3.2",
    "google-auth>=2.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["sales_common*"]

[tool.setuptools.package-data]
sales_common = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
