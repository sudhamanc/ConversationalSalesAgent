[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-agent"
version = "2.0.0"
description = "Product agent (ADK 2.x, A2A): technical specs and comparisons via the catalog MCP service"
requires-python = ">=3.11"
dependencies = [
    "sales-common",   # installed first from libs/sales_common
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["product_agent*"]
