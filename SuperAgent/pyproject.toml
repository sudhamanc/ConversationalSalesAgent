[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-sales-agent"
version = "2.0.0"
description = "B2B Sales gateway: FastAPI SSE chat + ADK 2.x sales_journey workflow over A2A agents"
requires-python = ">=3.11"
dependencies = [
    "sales-common",            # libs/sales_common (install first)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.1.0",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["super_agent", "super_agent.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "server"]
