[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-agent"
version = "2.0.0"
description = "Order agent A2A service: cart, order lifecycle and contracts (Conversational Sales Agent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sales-common"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["order_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
