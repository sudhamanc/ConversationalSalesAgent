[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-communication-agent"
version = "2.0.0"
description = "Customer communication agent A2A service + notification outbox dispatcher (Conversational Sales Agent)"
requires-python = ">=3.11"
dependencies = ["sales-common"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["customer_communication_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
