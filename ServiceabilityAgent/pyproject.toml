[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serviceability-agent"
version = "2.0.0"
description = "Serviceability Agent (A2A) - address validation and coverage via the serviceability MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sales-common",   # install libs/sales_common first (google-adk[a2a,mcp,db], psycopg)
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["serviceability_agent*"]
