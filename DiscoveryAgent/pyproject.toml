[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-agent"
version = "2.0.0"
description = "Discovery agent A2A service (ADK 2.x, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sales-common",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["discovery_agent", "discovery_agent.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
