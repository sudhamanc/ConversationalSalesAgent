schema: spec-driven

# Project context shown to AI when creating OpenSpec artifacts.
context: |
  Project: B2B Conversational Sales Agent (telecom/broadband B2B sales: discovery,
  serviceability, product catalog, offers/pricing, orders, payment, fulfillment,
  customer communications).

  Tech stack:
    - Python 3.12, Google ADK (google-adk 2.x), Gemini models via GEMINI_MODEL env var
    - Agent-to-agent communication: A2A protocol (each agent is its own container)
    - Tool access for catalog and serviceability: REST APIs (FastAPI) + MCP servers
      (streamable HTTP); agents consume them via ADK McpToolset
    - Data: PostgreSQL (Cloud SQL in GCP, postgres container locally); ChromaDB for
      product RAG embeddings
    - Backend gateway: FastAPI with SSE streaming; Frontend: React 19 + Vite + Tailwind CSS
    - Deployment: Docker, docker compose (local), Google Cloud Run (one service per container)

  Conventions:
    - Every agent follows the ADK Bootstrap Template layout (see AGENTS.md)
    - Deterministic business data comes from tools/APIs only, never from LLM generation
    - Tools return structured JSON with explicit field names
    - No hardcoded secrets; config via environment variables; fail fast on missing
      critical config (e.g. GEMINI_MODEL)
    - React: Tailwind CSS only, no inline styles
    - Documentation-first: AGENTS.md, component AGENTS.md, README.md stay in sync with code

  System map: openspec/BASELINE.md (read it first; it lists every service, port, agent,
  tool, journey-context key, handoff rule, command and known issue). Behavioral specs:
  openspec/specs/<capability>/spec.md. A change that alters anything BASELINE.md lists
  must update it (tests/test_baseline_doc.py checks services, ports and tools).

rules:
  proposal:
    - List the openspec/BASELINE.md sections the change affects (or "none")
    - Include a "Non-goals" section
    - Call out impact on agents, APIs/MCP servers, data, scripts, and documentation
  design:
    - Include a Mermaid diagram for any new or changed runtime topology
    - Cite the ADK / A2A / MCP API names actually used (import paths)
  tasks:
    - Group tasks by component (agent, service, script, docs)
    - Each task must be verifiable (test, command, or observable behavior)
